const chars = "     ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*+=-";

function randomChar() {
  return chars[Math.floor(Math.random() * chars.length)];
}

// build spans for each character
text.split("").forEach((ch) => {
  const span = document.createElement("span");
  span.className = "char";
  span.textContent = ch === "\n" ? "\n" : ch;
  container.appendChild(span);

  // only animate non-space characters
  if (ch !== "\n") {
    startGlitch(span);
  }
});

function startGlitch(span) {
  function update() {
    span.textContent = randomChar();

    // each letter gets its own random speed (50ms - 400ms)
    const delay = Math.random() * 1000 + 50;

    setTimeout(update, delay);
  }

  update();
}
setInterval(() => {

  // random “glitch blackout”
  monster.style.opacity = Math.random() > 0.85 ? 0 : 1;
}, 80);


window.addEventListener("DOMContentLoaded", () => {
  const scream = new Audio('media/scream.mp3');
  const rizzmas = new Audio('media/rizzmas.mp3');
  const monster = document.getElementById("scary");

  document.addEventListener('click', () => {
    scream.currentTime = 0;

    scream.play().then(() => {
      scream.onended = () => {

        // 👇 change image right when scream ends
        monster.src = "media/monster3.png";

        // then play second sound
        rizzmas.currentTime = 0;
        rizzmas.play().catch(() => {});
